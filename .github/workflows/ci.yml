name: Crystal CI

on:
  # Triggers when a PR is opened or updated
  pull_request:
    branches:
      - master

  # Triggers when code is merged to main, OR directly pushed to main
  push:
    branches:
      - master
    # Do not trigger a run if the ONLY changes are to these files:
    paths-ignore:
      - '**.md'      # Ignores README.md, CHANGELOG.md, etc.
      - 'LICENSE'

# Automatically cancel in-progress runs if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub deps (D16): alumna ~> 0.6.0, cryomongo ~> 0.17.5 (bson.cr 0.9.2 via cryomongo).
# Four topologies via cryomongo docker-topology.sh after shards install.
# Adapter URIs have no auth. Do not set GLIBC_TUNABLES here; that tunable is
# only a local workaround for kernel 7.1.x-zabbly+ (SERVER-121912).
# Coverage (kcov) stays one standalone job. Do not use services: mongo:8.0
# for clustered cells — a service container cannot start a replica set or mongos.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - run: crystal tool format --check

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - topology: standalone
            uri: mongodb://127.0.0.1:27017
          - topology: replicaset
            uri: mongodb://127.0.0.1:27017/?replicaSet=rs0
          - topology: sharded
            uri: mongodb://127.0.0.1:27017
          - topology: load-balanced
            uri: mongodb://127.0.0.1:8000/?loadBalanced=true
    runs-on: ubuntu-latest
    name: MongoDB 8.0 ${{ matrix.topology }}
    env:
      TOPOLOGY: ${{ matrix.topology }}
      MONGODB_URI: ${{ matrix.uri }}
    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - uses: actions/cache@v4
        with:
          path: |
            lib
            ~/.cache/shards
            %USERPROFILE%\.cache\shards
          key: ${{ runner.os }}-crystal-latest-shards-${{ hashFiles('shard.yml') }}
          restore-keys: |
            ${{ runner.os }}-crystal-latest-shards-
      - run: shards install

      # Clustered cells cannot use services: mongo:8.0. Standalone uses the
      # same script so 27017 is not bound twice.
      - name: Start MongoDB ${{ matrix.topology }}
        run: |
          set -euo pipefail
          script="lib/cryomongo/scripts/docker-topology.sh"
          if [[ ! -f "$script" ]]; then
            echo "missing $script after shards install" >&2
            ls -la lib/cryomongo/scripts 2>/dev/null || true
            exit 1
          fi
          bash "$script" "${{ matrix.topology }}"

      - name: Start HAProxy (load-balanced)
        if: matrix.topology == 'load-balanced'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y haproxy
          lb="lib/cryomongo/scripts/run-load-balancer.sh"
          if [[ ! -f "$lb" ]]; then
            echo "missing $lb after shards install" >&2
            exit 1
          fi
          bash "$lb" start

      - name: Run specs (Single-Threaded)
        run: crystal spec --error-trace --verbose

      - name: Run specs (Multi-Threaded)
        run: crystal spec -Dpreview_mt -Dexecution_context --error-trace --verbose

  coverage:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    env:
      TOPOLOGY: standalone
      MONGODB_URI: mongodb://127.0.0.1:27017
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y kcov

      - uses: actions/cache@v6
        with:
          path: |
            lib
            ~/.cache/shards
          key: ubuntu-22.04-crystal-latest-shards-${{ hashFiles('shard.yml') }}

      - run: shards install

      - name: Build specs binary
        run: |
          echo 'require "./spec/**"' > all_specs.cr
          mkdir -p bin coverage
          crystal build all_specs.cr -o bin/all_specs --debug

      - name: Run kcov (core coverage)
        run: |
          kcov --clean --include-path=$(pwd)/src ./coverage ./bin/all_specs

      - name: Generate unreachable report
        run: |
          crystal tool unreachable --format=codecov --no-color --exclude spec all_specs.cr > ./coverage/unreachable.codecov.json

      - name: Generate macro coverage
        run: |
          crystal tool macro_code_coverage --format=codecov --no-color all_specs.cr > ./coverage/macro_coverage.root.codecov.json

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: alumna/mongodb
          files: ./coverage/**/cobertura.xml,./coverage/**/cov.xml,./coverage/unreachable.codecov.json,./coverage/macro_coverage.*.codecov.json
          flags: unittests
          fail_ci_if_error: true
          verbose: true

      - name: Run specs and generate JUnit XML for Test Analytics
        run: |
          mkdir -p junit
          crystal spec --junit_output ./junit --error-trace

      - name: Upload test results to Codecov (Test Analytics)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: alumna/mongodb
          report_type: test_results
          files: ./junit/output.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: true
